<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_50 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_50" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_50');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('threejs-book-hero') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
camera.position.set(0, 0.4, 7.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Atmospheric Studio & Academic Lighting
const ambientLight = new THREE.AmbientLight(0xd9eef5, 1.2);
scene.add(ambientLight);

const mainKeyLight = new THREE.DirectionalLight(0xffffff, 1.4);
mainKeyLight.position.set(5, 7, 6);
mainKeyLight.castShadow = true;
mainKeyLight.shadow.mapSize.width = 1024;
mainKeyLight.shadow.mapSize.height = 1024;
scene.add(mainKeyLight);

const primaryBlueLight = new THREE.PointLight(0x287ea7, 2.2, 18);
primaryBlueLight.position.set(-5, 3, 3);
scene.add(primaryBlueLight);

const limeAccentLight = new THREE.PointLight(0x9be564, 1.8, 12);
limeAccentLight.position.set(3, -2, 4);
scene.add(limeAccentLight);

const softUnderGlow = new THREE.PointLight(0x67b7d6, 1.5, 15);
softUnderGlow.position.set(0, -3.5, 2);
scene.add(softUnderGlow);

// Helper for realistic scholastic hardcover books
function createBookMesh(coverHex, spineTextHex, width = 1.7, height = 2.4, thickness = 0.36) {
  const group = new THREE.Group();

  const coverMat = new THREE.MeshPhongMaterial({
    color: coverHex,
    specular: 0x67b7d6,
    shininess: 45
  });

  const pagesMat = new THREE.MeshLambertMaterial({
    color: 0xfaf9f5
  });

  // Pages Block
  const pagesGeo = new THREE.BoxGeometry(width - 0.08, height - 0.1, thickness - 0.05);
  const pagesMesh = new THREE.Mesh(pagesGeo, pagesMat);
  pagesMesh.position.set(0.04, 0, 0);
  pagesMesh.castShadow = true;
  pagesMesh.receiveShadow = true;
  group.add(pagesMesh);

  // Front & Back Hardcovers
  const coverGeo = new THREE.BoxGeometry(width, height, 0.038);
  const frontCover = new THREE.Mesh(coverGeo, coverMat);
  frontCover.position.set(0, 0, thickness / 2);
  frontCover.castShadow = true;
  group.add(frontCover);

  const backCover = new THREE.Mesh(coverGeo, coverMat);
  backCover.position.set(0, 0, -thickness / 2);
  backCover.receiveShadow = true;
  group.add(backCover);

  // Spine
  const spineGeo = new THREE.BoxGeometry(0.045, height, thickness + 0.038);
  const spine = new THREE.Mesh(spineGeo, coverMat);
  spine.position.set(-width / 2, 0, 0);
  group.add(spine);

  // Gold foil embossed spine detail
  const foilGeo = new THREE.BoxGeometry(0.05, height * 0.45, 0.01);
  const foilMat = new THREE.MeshPhongMaterial({ color: 0x9be564, shininess: 80 });
  const foil = new THREE.Mesh(foilGeo, foilMat);
  foil.position.set(-width / 2 - 0.005, 0, 0);
  group.add(foil);

  // Front cover embossed frame
  const frameGeo = new THREE.BoxGeometry(width * 0.78, height * 0.8, 0.042);
  const frameMat = new THREE.MeshBasicMaterial({ color: spineTextHex || 0xd9eef5, wireframe: true });
  const frame = new THREE.Mesh(frameGeo, frameMat);
  frame.position.set(0.04, 0, thickness / 2 + 0.004);
  group.add(frame);

  return group;
}

// Master book cluster
const masterCluster = new THREE.Group();
scene.add(masterCluster);

// 1. Centerpiece: Open Hardcover Curatorial Book
const openBookGroup = new THREE.Group();
const pageHalfGeo = new THREE.BoxGeometry(1.25, 1.85, 0.032);
const pageMat = new THREE.MeshLambertMaterial({ color: 0xfaf9f5 });
const coverMat = new THREE.MeshPhongMaterial({ color: 0x164e63, shininess: 35 });

const leftPage = new THREE.Mesh(pageHalfGeo, pageMat);
leftPage.position.set(-0.6, 0, 0.06);
leftPage.rotation.y = 0.28;

const rightPage = new THREE.Mesh(pageHalfGeo, pageMat);
rightPage.position.set(0.6, 0, 0.06);
rightPage.rotation.y = -0.28;

const leftCover = new THREE.Mesh(pageHalfGeo, coverMat);
leftCover.position.set(-0.62, 0, 0.01);
leftCover.rotation.y = 0.28;

const rightCover = new THREE.Mesh(pageHalfGeo, coverMat);
rightCover.position.set(0.62, 0, 0.01);
rightCover.rotation.y = -0.28;

openBookGroup.add(leftPage, rightPage, leftCover, rightCover);

// Lime Silk Bookmark Ribbon
const ribbonGeo = new THREE.BoxGeometry(0.1, 2.0, 0.01);
const ribbonMat = new THREE.MeshPhongMaterial({ color: 0x9be564, shininess: 70 });
const ribbon = new THREE.Mesh(ribbonGeo, ribbonMat);
ribbon.position.set(0.06, -0.25, 0.14);
ribbon.rotation.z = -0.16;
openBookGroup.add(ribbon);

openBookGroup.position.set(0.1, -0.15, 0.75);
openBookGroup.rotation.set(0.38, 0.08, -0.06);
masterCluster.add(openBookGroup);

// 2. Floating Book (Left top - Primary Katipuneros Blue)
const bookLeft = createBookMesh(0x287ea7, 0x9be564, 1.5, 2.15, 0.32);
bookLeft.position.set(-1.9, 0.85, -0.4);
bookLeft.rotation.set(-0.24, 0.48, 0.18);
masterCluster.add(bookLeft);

// 3. Floating Book (Right top - Deep Scholastic Cyan Blue)
const bookRight = createBookMesh(0x164e63, 0x67b7d6, 1.45, 2.05, 0.3);
bookRight.position.set(1.95, 0.75, 0.2);
bookRight.rotation.set(0.28, -0.44, -0.16);
masterCluster.add(bookRight);

// 4. Stacked Base Books (Bottom Right)
const stackBook1 = createBookMesh(0x287ea7, 0xfaf9f5, 1.6, 2.2, 0.36);
stackBook1.position.set(1.2, -1.45, -0.3);
stackBook1.rotation.set(1.42, -0.08, 0.35);
masterCluster.add(stackBook1);

const stackBook2 = createBookMesh(0x67b7d6, 0x164e63, 1.5, 2.1, 0.28);
stackBook2.position.set(1.26, -1.18, -0.25);
stackBook2.rotation.set(1.44, -0.04, 0.52);
masterCluster.add(stackBook2);

// 5. Floating Translucent Glass Library Patron Token / Card
const glassCardGeo = new THREE.BoxGeometry(1.25, 0.8, 0.02);
const glassCardMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  transmission: 0.88,
  opacity: 1,
  transparent: true,
  roughness: 0.15,
  ior: 1.45,
  thickness: 0.3
});
const glassCard = new THREE.Mesh(glassCardGeo, glassCardMat);
glassCard.position.set(-1.65, -1.15, 0.95);
glassCard.rotation.set(0.12, 0.32, -0.18);

const chipGeo = new THREE.BoxGeometry(0.24, 0.2, 0.025);
const chipMat = new THREE.MeshPhongMaterial({ color: 0x9be564 });
const chip = new THREE.Mesh(chipGeo, chipMat);
chip.position.set(-0.38, 0.15, 0.005);
glassCard.add(chip);

masterCluster.add(glassCard);

// 6. Orbital Energy Rings (Soft Sky Blue and Lime accents)
const ring1Geo = new THREE.TorusGeometry(3.3, 0.012, 16, 120);
const ring1Mat = new THREE.MeshBasicMaterial({ color: 0x67b7d6, transparent: true, opacity: 0.42 });
const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
ring1.rotation.x = Math.PI * 0.36;
ring1.rotation.y = 0.22;
scene.add(ring1);

const ring2Geo = new THREE.TorusGeometry(2.5, 0.009, 16, 90);
const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x9be564, transparent: true, opacity: 0.35 });
const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
ring2.rotation.x = -Math.PI * 0.32;
ring2.rotation.y = -0.38;
scene.add(ring2);

// Floating ambient scholastic particles
const particleCount = 48;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
  particlePos[i] = (Math.random() - 0.5) * 8.5;
  particlePos[i + 1] = (Math.random() - 0.5) * 6.5;
  particlePos[i + 2] = (Math.random() - 0.5) * 4.5;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.048,
  color: 0x67b7d6,
  transparent: true,
  opacity: 0.65
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Mouse parallax listeners
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

// Render Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  masterCluster.rotation.y = targetX * 0.34 + Math.sin(elapsed * 0.45) * 0.04;
  masterCluster.rotation.x = -targetY * 0.22 + Math.cos(elapsed * 0.55) * 0.03;

  openBookGroup.position.y = -0.15 + Math.sin(elapsed * 0.8) * 0.05;
  bookLeft.position.y = 0.85 + Math.cos(elapsed * 0.9) * 0.07;
  bookLeft.rotation.z = 0.18 + Math.sin(elapsed * 0.65) * 0.03;

  bookRight.position.y = 0.75 + Math.sin(elapsed * 0.75 + 1.1) * 0.06;
  glassCard.position.y = -1.15 + Math.cos(elapsed * 0.85 + 2.0) * 0.04;

  ring1.rotation.z = elapsed * 0.045;
  ring2.rotation.z = -elapsed * 0.06;
  particles.rotation.y = elapsed * 0.015;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const newWidth = container.clientWidth || window.innerWidth;
  const newHeight = container.clientHeight || window.innerHeight;
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_50 -->
</body>
</html>
