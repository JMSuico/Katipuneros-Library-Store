# ─────────────────────────────────────────────────────────────────────────────
# Katipuneros Library Store -- TEMPLATE ONLY. CONTAINS NO REAL SECRETS.
#
# NOT applied by kubectl as-is. Choose a delivery mechanism:
#
#   1. Sealed Secrets (preferred, keeps everything in plain git)
#      kubeseal --format yaml < 01-secrets.real.yaml > 01-secrets.sealed.yaml
#
#   2. External Secrets Operator -- replace this with an ExternalSecret
#      pointing at AWS Secrets Manager / GCP Secret Manager / Azure Key Vault.
#
#   3. kubectl create secret --from-literal=... (never recorded in git)
#
# ── KEY NAMING IS LOAD-BEARING ───────────────────────────────────────────
# Both the backend Deployment and the PostgreSQL StatefulSet consume this Secret
# via `envFrom.secretRef`, which injects each KEY NAME as an environment variable.
# The names below are therefore contract, not convention:
#
#   POSTGRES_* ......... consumed by the postgres:16-alpine entrypoint
#   *__* (double under) consumed by ASP.NET Core configuration
#
# Renaming a key silently breaks startup rather than erroring loudly.
#
# NEVER commit a populated copy of this file.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: katipuneros-secrets
  namespace: katipuneros-prod
type: Opaque
stringData:
  # ── PostgreSQL layer 7/8 ───────────────────────────────────────────────
  POSTGRES_DB: "KatipunerosLibraryDb"
  POSTGRES_USER: "<pg-user>"
  POSTGRES_PASSWORD: "<pg-password>"
  POSTGRES_REPLICATION_USER: "replicator"
  POSTGRES_REPLICATION_PASSWORD: "<pg-repl-password>"

  # ── Redis layer 6 ──────────────────────────────────────────────────────
  REDIS_PASSWORD: "<redis-password>"

  # ── Backend .NET configuration ─────────────────────────────────────────
  # Generate: openssl rand -base64 48   (must be >= 32 bytes)
  Jwt__SecretKey: "<jwt-signing-key>"

  # Generate: openssl rand -base64 32
  Altcha__HmacSecret: "<altcha-hmac-key>"

  # Composed connection strings. Must embed the same pg-user / pg-password above.
  ConnectionStrings__PrimaryConnection: "Host=katipuneros-db-primary;Port=5432;Database=KatipunerosLibraryDb;Username=<pg-user>;Password=<pg-password>;Include Error Detail=true;"
  ConnectionStrings__ReplicaConnection: "Host=katipuneros-db-replica;Port=5432;Database=KatipunerosLibraryDb;Username=<pg-user>;Password=<pg-password>;Application Name=Katipuneros_ReadReplica;"
  Redis__ConnectionString: "katipuneros-redis:6379,password=<redis-password>"

  # ── Optional -- email self-disables when unset ─────────────────────────
  SmtpSettings__AppPassword: "<google-app-password>"
  SmtpSettings__SenderEmail: "library@localhost"
