apiVersion: apps/v1
kind: Deployment
metadata:
  name: katipuneros-admin
  namespace: katipuneros-prod
  labels:
    app: katipuneros-admin
    layer: "4"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: katipuneros-admin
  template:
    metadata:
      labels:
        app: katipuneros-admin
        layer: "4"
    spec:
      containers:
        - name: admin
          image: katipuneros-admin:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: katipuneros-admin-svc
  namespace: katipuneros-prod
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: katipuneros-admin
