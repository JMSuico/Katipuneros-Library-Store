apiVersion: v1
kind: ConfigMap
metadata:
  name: katipuneros-config
  namespace: katipuneros-prod
# NON-SECRET configuration only. Credentials are NOT stored here.
# The backend Deployment injects them via `secretKeyRef` against the
# `katipuneros-secrets` Secret (see k8s/01-secrets.template.yaml).
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "KatipunerosLibraryApi"
  Jwt__Audience: "KatipunerosLibraryClient"
  Jwt__ExpiryHours: "24"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: katipuneros-pg-primary-config
  namespace: katipuneros-prod
data:
  01-init.sh: |
    #!/bin/bash
    set -e

    # The replication password arrives from the `katipuneros-secrets` Secret as an
    # env var. Fail loudly rather than provisioning a role with a default password.
    : "${POSTGRES_REPLICATION_PASSWORD:?POSTGRES_REPLICATION_PASSWORD is required}"

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE ROLE ${POSTGRES_REPLICATION_USER:-replicator} WITH REPLICATION LOGIN ENCRYPTED PASSWORD '${POSTGRES_REPLICATION_PASSWORD}';
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    EOSQL

    echo "host replication ${POSTGRES_REPLICATION_USER:-replicator} 0.0.0.0/0 scram-sha-256" >> "$PGDATA/pg_hba.conf"
    pg_ctl -D "$PGDATA" reload
  postgresql.conf: |
    listen_addresses = '*'
    wal_level = replica
    max_wal_senders = 10
    wal_keep_size = 512MB
    hot_standby = on
    shared_buffers = 256MB
    effective_cache_size = 768MB
    work_mem = 16MB
    maintenance_work_mem = 64MB
    max_connections = 200
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    timeout 0
    tcp-keepalive 300
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
