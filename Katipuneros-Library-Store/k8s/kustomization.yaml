apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: katipuneros-prod

resources:
  - 00-namespace.yaml
  - 02-configmaps.yaml
  - 03-persistent-volumes.yaml
  - 04-layer7-primary-db.yaml
  - 05-layer8-replica-db.yaml
  - 06-layer6-redis.yaml
  - 07-layer5-backend.yaml
  - 08-layer1-landing.yaml
  - 09-layer2-customer.yaml
  - 10-layer3-cashier.yaml
  - 11-layer4-admin.yaml
  - 12-ingress.yaml

# NOTE: 01-secrets.template.yaml is deliberately NOT listed.
# Secrets must be delivered out-of-band (Sealed Secrets / External Secrets /
# `kubectl create secret`). Adding the template here would apply placeholder
# credentials. Create a local `01-secrets.yaml` from the template if you need
# a concrete manifest -- it is git-ignored.
