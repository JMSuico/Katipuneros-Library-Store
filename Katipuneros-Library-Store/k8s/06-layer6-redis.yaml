apiVersion: apps/v1
kind: Deployment
metadata:
  name: katipuneros-redis
  namespace: katipuneros-prod
  labels:
    app: katipuneros-redis
    layer: "6"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: katipuneros-redis
  template:
    metadata:
      labels:
        app: katipuneros-redis
        layer: "6"
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "--requirepass", "KatipunerosRedisSecret_2026!"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: katipuneros-redis
  namespace: katipuneros-prod
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: katipuneros-redis
